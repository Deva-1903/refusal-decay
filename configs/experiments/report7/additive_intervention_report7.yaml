# Report 7 additive refusal-direction intervention.

report7:
  condition: harmful_k03
  dataset: harmful
  output_root: outputs/report7

data:
  harmful_prompts: data/processed/report7_traced_harmful.jsonl
  max_prompts: 25

generation:
  max_new_tokens: 64

prefilling:
  k_values: [3]

probing:
  direction_save_path: outputs/report7/directions/refusal_direction.pt

intervention:
  # Layer 16 retained as a specificity control: the late-layer-localization
  # hypothesis predicts restoration should be weaker at 16 than at 24/27.
  layers: [16, 24, 27]
  # Position 0 is the refusal-commitment token; 1 and 3 cover the early
  # generation window. Drop 5 unless 0/1/3 show signal.
  target_positions: [0, 1, 3]
  # Drop alpha=0.5 (uninformative if it does nothing); keep 1.0 and 2.0.
  alphas: [1.0, 2.0]
  # refusal = primary; random + orthogonal = direction-specificity controls.
  direction_types: [refusal, random, orthogonal]
  output_dir: outputs/report7/interventions
  # Multi-seed control: random and orthogonal directions are run for every seed
  # so the noise floor across random vectors can be reported (mean +/- std).
  # `refusal` is deterministic and only uses the first seed.
  seeds: [42, 43, 44, 45, 46]

output:
  log_dir: outputs/report7/logs

logging:
  level: INFO
