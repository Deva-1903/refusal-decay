# Report 7 tracing config for standardized summaries.

report7:
  trace_dataset: harmful
  source_report6_trace_dir: outputs/report6/traces

data:
  max_prompts: 25

generation:
  max_new_tokens: 48

prefilling:
  k_values: [0, 3, 10]

probing:
  layers: [16, 20, 24, 27]
  direction_position: -1
  direction_save_path: outputs/report7/directions/refusal_direction.pt

tracing:
  output_dir: outputs/report7/traces
  save_format: parquet

output:
  log_dir: outputs/report7/logs

logging:
  level: INFO
